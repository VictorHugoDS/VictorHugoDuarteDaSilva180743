# -------------------------
# Application
# -------------------------
spring.application.name=hamix


# -------------------------
# Server
# -------------------------
server.servlet.context-path=/hamix/api/v1
server.port=8080


# -------------------------
# Datasource (PostgreSQL)
# -------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/hamix
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------
# Security (basic)
# -------------------------
spring.security.user.name=senha
spring.security.user.password=senha
jwt.secret=eu-sou-uma-chave-muito-segura-mesmo
jwt.access-token-minutes=5
jwt.refresh-token-minutes=30
cors.allowed-origins=http://localhost:8081

# -------------------------
# Actuator (Health/Readiness/Liveness)
# -------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never
springdoc.show-actuator=true

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# Flyway
# -------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.user=myuser
spring.flyway.password=secret
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.jpa.properties.hibernate.default_schema=public


# -------------------------
# Min.io
# -------------------------
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=fotos
minio.expiration-time=1800
