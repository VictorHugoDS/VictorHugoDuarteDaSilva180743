# -------------------------
# Application
# -------------------------
spring.application.name=hamix


# -------------------------
# Server
# -------------------------
server.servlet.context-path=/hamix/api/v1
server.port=9090


# -------------------------
# Datasource (PostgreSQL)
# -------------------------
spring.datasource.url=jdbc:postgresql://localhost:55403/hamix
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------
# Security (basic)
# -------------------------
spring.security.user.name=senha
spring.security.user.password=senha

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# Flyway
# -------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.user=myuser
spring.flyway.password=secret
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.jpa.properties.hibernate.default_schema=public


# -------------------------
# Min.io
# -------------------------
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=fotos
minio.expiration-time=1800
