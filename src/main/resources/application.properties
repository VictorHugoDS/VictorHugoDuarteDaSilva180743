# -------------------------
# Application
# -------------------------
spring.application.name=hamix


# -------------------------
# Server
# -------------------------
server.servlet.context-path=/hamix/api/v1
server.port=8080


# -------------------------
# Datasource (PostgreSQL)
# -------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hamix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# -------------------------
# Security (basic)
# -------------------------
spring.security.user.name=${SPRING_SECURITY_USER_NAME:senha}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:senha}
jwt.secret=${JWT_SECRET:eu-sou-uma-chave-muito-segura-mesmo}
jwt.access-token-minutes=5
jwt.refresh-token-minutes=30
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# -------------------------
# Actuator (Health/Readiness/Liveness)
# -------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never
springdoc.show-actuator=true

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# Flyway
# -------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.user=${SPRING_FLYWAY_USER:myuser}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:secret}
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.jpa.properties.hibernate.default_schema=public


# -------------------------
# Min.io
# -------------------------
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:fotos}
minio.expiration-time=${MINIO_EXPIRATION_TIME:1800}
